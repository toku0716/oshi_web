<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var mode = localStorage.getItem('oshiss_theme_mode');
        if (mode === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>推しサポ｜Web版 — 推し活をもっと楽しくスマートに。</title>
    <meta name="description" content="予定・TODO・グッズをまとめて管理できる推し活アプリ。ログイン不要・完全ローカル動作。" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="推しサポ" />
    <meta name="application-name" content="推しサポ" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
