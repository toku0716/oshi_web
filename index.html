<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 初回描画前にテーマを確定させ、ダークモード利用者の「白いフラッシュ」を防ぐ
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('oshiss_theme_mode'); } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || ((mode === 'system' || !mode) && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
        var color = null;
        try { color = localStorage.getItem('oshiss_theme_color'); } catch (e) {}
        if (color) document.documentElement.style.setProperty('--oshi-color', color);
        document.addEventListener('DOMContentLoaded', function () {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#090A0D' : '#F9FAFB');
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>推しサポ - 推し活管理アプリ</title>
    <meta name="description" content="イベント・グッズ・推し活TODOを端末内で安全に一括管理できる推し活サポートアプリ" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#F9FAFB" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="推しサポ" />
    <meta name="application-name" content="推しサポ" />
  </head>
  <body>
    <noscript>推しサポを利用するには JavaScript を有効にしてください。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
