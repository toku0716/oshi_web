<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var mode = null;
        try { mode = localStorage.getItem('oshiss_theme_mode'); } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || ((mode === 'system' || !mode) && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推しサポ 管理者コンソール (Admin)</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/adminMain.tsx"></script>
  </body>
</html>
