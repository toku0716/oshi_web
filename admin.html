<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var mode = null;
        try { mode = localStorage.getItem('oshiss_theme_mode'); } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || ((mode === 'system' || !mode) && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>推しサポ 管理者コンソール (Admin)</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts: M PLUS Rounded 1c & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/adminMain.tsx"></script>
  </body>
</html>
